<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>AsiaCar Premium 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">
  <div class="max-w-md mx-auto p-4">
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-black text-blue-600 italic uppercase tracking-tighter">AsiaCar</h1>
      <div class="text-[10px] font-bold bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm text-slate-400">PRO SYSTEM</div>
    </header>

    <!-- Tabs -->
    <div class="bg-white rounded-2xl p-2 shadow-sm border border-slate-100 mb-4 sticky top-2 z-30">
      <div class="grid grid-cols-3 gap-2">
        <button id="tabAll" class="py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-900 text-white">Все</button>
        <button id="tabFav" class="py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-100 text-slate-700">Избранные</button>
        <button id="toggleFilters" class="py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-blue-600 text-white">Фильтры</button>
      </div>
    </div>

    <!-- Filters (collapsible) -->
    <div id="filtersWrap" class="bg-white rounded-[2.5rem] p-6 shadow-xl border border-slate-100 mb-6 hidden">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <select id="brand" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none" onchange="updateModels()">
          <option value="">Все марки</option>
          <option value="BYD">BYD</option>
          <option value="CHERY">Chery</option>
          <option value="CHANGAN">Changan</option>
          <option value="EXEED">Exeed</option>
          <option value="GAC">GAC</option>
          <option value="GEELY">Geely</option>
          <option value="HAVAL">Haval</option>
          <option value="HONGQI">Hongqi</option>
          <option value="JAECOO">Jaecoo</option>
          <option value="JETOUR">Jetour</option>
          <option value="LEAPMOTOR">Leapmotor</option>
          <option value="LI AUTO">Li Auto</option>
          <option value="LYNK &amp; CO">Lynk &amp; Co</option>
          <option value="NIO">Nio</option>
          <option value="OMODA">Omoda</option>
          <option value="TANK">Tank</option>
          <option value="WEY">Wey</option>
          <option value="XPENG">Xpeng</option>
          <option value="XIAOMI">Xiaomi</option>
          <option value="ZEEKR">Zeekr</option>
          <option value="AUDI">Audi</option>
          <option value="BMW">BMW</option>
          <option value="MERCEDES-BENZ">Mercedes-Benz</option>
          <option value="VOLKSWAGEN">Volkswagen</option>
          <option value="HONDA">Honda</option>
          <option value="NISSAN">Nissan</option>
          <option value="TOYOTA">Toyota</option>
          <option value="LEXUS">Lexus</option>
          <option value="TESLA">Tesla</option>
          <option value="BUICK">Buick</option>
          <option value="CADILLAC">Cadillac</option>
          <option value="SUBARU">Subaru</option>
        </select>

        <select id="model" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none">
          <option value="">Любая модель</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <select id="year" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none">
          <option value="">Год от</option>
        </select>
        <select id="power" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold border-blue-200 border outline-none appearance-none">
          <option value="">Мощность (любая)</option>
          <option value="low">До 160 л.с.</option>
          <option value="high">160+ л.с.</option>
        </select>
      </div>

      <div class="space-y-4 mb-8">
        <div class="flex justify-between text-[11px] font-black uppercase text-slate-400">
          <span>От: <span id="minVal" class="text-blue-600 tracking-tighter">1.0 млн</span></span>
          <span>До: <span id="maxVal" class="text-blue-600 tracking-tighter">10.0 млн</span></span>
        </div>
        <input type="range" id="priceMin" min="1000000" max="15000000" step="500000" value="1000000" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
        <input type="range" id="priceMax" min="1000000" max="15000000" step="500000" value="10000000" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button id="btnApply" class="w-full bg-blue-600 text-white font-black py-5 rounded-[1.5rem] shadow-lg active:scale-95 transition-all uppercase text-[10px] tracking-[0.2em]">
          Применить
        </button>
        <button id="btnReset" class="w-full bg-slate-900 text-white font-black py-5 rounded-[1.5rem] shadow-lg active:scale-95 transition-all uppercase text-[10px] tracking-[0.2em]">
          Сброс
        </button>
      </div>
    </div>

    <!-- List -->
    <div id="list" class="space-y-10 pb-24"></div>
  </div>

  <script>
    // ====== Telegram ======
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // ====== Models ======
    const modelsData = {
      "GEELY": ["Monjaro", "Tugella", "Coolray", "Preface", "Okavango", "Emgrand", "Boyue L", "Xingyue L", "Galaxy L7", "Galaxy E8"],
      "BYD": ["Han", "Tang", "Seal", "Dolphin", "Seagull", "Qin Plus", "Qin L", "Song Plus", "Song Pro", "Destroyer 05", "Frigate 07", "Yuan Plus"],
      "ZEEKR": ["001", "007", "009", "X"],
      "LI AUTO": ["L6", "L7", "L8", "L9", "MEGA"],
      "CHERY": ["Arrizo 8", "Tiggo 7 Pro", "Tiggo 8 Pro Max", "Tiggo 9"],
      "EXEED": ["RX", "TXL", "VX"],
      "OMODA": ["Omoda C5"],
      "JAECOO": ["Jaecoo J7"],
      "JETOUR": ["X70", "X90"],
      "TANK": ["300", "400 Hi4-T", "500 Hi4-T", "700 Hi4-T"],
      "HAVAL": ["H6", "Dargo", "Jolion"],
      "WEY": ["Coffee 01", "Coffee 02"],
      "CHANGAN": ["CS35 Plus", "CS55 Plus", "CS75 Plus", "UNI-K", "UNI-T", "UNI-V"],
      "GAC": ["GS8", "Aion Y"],
      "HONGQI": ["H5", "H9"],
      "LEAPMOTOR": ["C10", "C11"],
      "NIO": ["ES6", "ET5"],
      "XPENG": ["G6", "P7"],
      "XIAOMI": ["SU7", "MX11"],
      "LYNK & CO": ["01", "03"],
      "TOYOTA": ["Camry", "RAV4", "Highlander", "Frontlander", "Crown Kluger", "Sienna", "Alphard", "Corolla", "Corolla Cross", "Avalon", "Prado"],
      "NISSAN": ["Sylphy", "Altima", "Ariya", "Qashqai", "X-Trail"],
      "HONDA": ["Civic", "Accord", "CR-V", "HR-V", "ZR-V", "Odyssey", "Elysion"],
      "LEXUS": ["ES", "NX", "RX", "GX", "LX", "LM", "IS", "LS", "RZ"],
      "VOLKSWAGEN": ["Passat Pro", "Magotan", "Sagitar", "Tayron L", "Tayron X", "Teramont", "Teramont X", "Tavendor", "Talagon", "ID.3", "ID.4 X", "ID.6 X", "Touareg", "CC"],
      "AUDI": ["A3 Sportback", "A3 Limousine", "A4L", "A6L", "A7L", "A8L", "Q2L", "Q3", "Q3 Sportback", "Q5L", "Q5L Sportback", "Q7", "Q8"],
      "BMW": ["i3", "i4", "i7", "iX1", "iX3", "3 Series L", "5 Series L", "X1 L", "X3 L", "X5 L", "7 Series", "M3", "M4", "M5"],
      "MERCEDES-BENZ": ["A-Class L", "C-Class L", "E-Class L", "S-Class", "GLA", "GLB", "GLC L", "GLE", "GLS", "G-Class", "EQB", "EQC", "EQE", "EQS"],
      "TESLA": ["Model 3", "Model Y", "Model YL", "Cybertruck"],
      "BUICK": ["GL8", "Regal", "Envision", "Encore", "LaCrosse"],
      "CADILLAC": ["CT4", "CT5", "CT6", "Lyriq"],
      "SUBARU": ["Forester", "Outback", "XV"]
    };

    function updateModels() {
      const b = document.getElementById('brand').value;
      const m = document.getElementById('model');
      m.innerHTML = '<option value="">Любая модель</option>';
      if (modelsData[b]) {
        modelsData[b].forEach(item => m.innerHTML += `<option value="${item.toUpperCase()}">${item}</option>`);
      }
    }

    function fillYears(minYear = 1990) {
      const yearSelect = document.getElementById('year');
      const currentYear = new Date().getFullYear();
      yearSelect.innerHTML = '<option value="">Год от</option>';
      for (let y = currentYear; y >= minYear; y--) {
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    // ====== Price sliders ======
    const pMin = document.getElementById("priceMin");
    const pMax = document.getElementById("priceMax");
    const minValEl = document.getElementById("minVal");
    const maxValEl = document.getElementById("maxVal");

    function syncPriceLabels() {
      minValEl.innerText = (pMin.value/1000000).toFixed(1) + ' млн';
      maxValEl.innerText = (pMax.value/1000000).toFixed(1) + ' млн';
    }
    pMin.oninput = syncPriceLabels;
    pMax.oninput = syncPriceLabels;

    // ====== App state ======
    const API_URL = 'https://plifartorikern.beget.app/webhook/get-cars';
    let currentTab = 'all';
    let lastCars = [];

    // ====== Favorites (localStorage) ======
    const FAV_KEY = 'asiacar_favorites_v1';

    function loadFavMap() {
      try {
        const raw = localStorage.getItem(FAV_KEY);
        const obj = raw ? JSON.parse(raw) : {};
        return (obj && typeof obj === 'object') ? obj : {};
      } catch {
        return {};
      }
    }

    function saveFavMap(map) {
      localStorage.setItem(FAV_KEY, JSON.stringify(map));
    }

    function carId(c) {
      // максимально стабильный идентификатор
      const u = (c?.url || '').trim();
      if (u) return 'u:' + u;
      return 'x:' + [c?.name, c?.year, c?.km, c?.photo].map(v => (v ?? '')).join('|');
    }

    function isFav(c) {
      const fav = loadFavMap();
      return !!fav[carId(c)];
    }

    function toggleFav(c) {
      const fav = loadFavMap();
      const id = carId(c);
      if (fav[id]) delete fav[id];
      else fav[id] = { savedAt: Date.now(), car: c };
      saveFavMap(fav);
      render();
    }

    function getFavCars() {
      const fav = loadFavMap();
      return Object.values(fav)
        .sort((a,b) => (b.savedAt || 0) - (a.savedAt || 0))
        .map(x => x.car)
        .filter(Boolean);
    }

    // ====== UI helpers ======
    function safeText(v, fallback = '') {
      return (v === null || v === undefined) ? fallback : String(v);
    }

    function safePhotosFromCar(c) {
      const arr = Array.isArray(c.photos) ? c.photos.filter(Boolean) : [];
      return arr.length ? arr : (c.photo ? [c.photo] : []);
    }

    function escapeForDataAttr(jsonString) {
      return jsonString.replace(/</g, '\\u003c').replace(/&/g, '\\u0026');
    }

    function getTurnkeyPrice(c) {
      if (c && c.priceRub) return c.priceRub;
      const n = c?.priceBreakdown?.total ?? null;
      return typeof n === 'number' ? n.toLocaleString('ru-RU') : '';
    }

    function renderOptions(c) {
      const opt = c?.options ?? c?.specs ?? null;
      if (!opt) return `<div class="text-[12px] text-slate-400 font-bold">Нет данных</div>`;
      const entries = typeof opt === 'object' ? Object.entries(opt) : [];
      if (!entries.length) return `<div class="text-[12px] text-slate-400 font-bold">Нет данных</div>`;
      return `
        <div class="grid grid-cols-1 gap-2">
          ${entries.slice(0, 14).map(([k, v]) => `
            <div class="flex justify-between gap-3 text-[12px] font-bold uppercase">
              <span class="text-slate-400">${safeText(k).replace(/_/g,' ')}</span>
              <span class="text-slate-900 text-right">${safeText(v)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function attachGalleryHandlers() {
      document.querySelectorAll('.js-thumb').forEach(th => {
        th.onclick = (e) => {
          const idx = e.currentTarget.dataset.idx;
          const card = e.currentTarget.closest('.relative');
          const main = card?.querySelector('.js-main-photo');
          if (!main) return;
          const photos = JSON.parse(main.dataset.photos || '[]');
          main.src = photos[idx];
          main.dataset.index = idx;
        };
      });

      document.querySelectorAll('.js-like').forEach(btn => {
        btn.onclick = (e) => {
          const idx = Number(e.currentTarget.dataset.idx);
          const car = (currentTab === 'fav') ? getFavCars()[idx] : lastCars[idx];
          if (!car) return;
          toggleFav(car);
        };
      });
    }

    // ====== Filters get/set ======
    function getUserInfoForLogs() {
      const user = tg?.initDataUnsafe?.user;
      let userInfo = 'Аноним';
      if (user) {
        const name = `${user.first_name || ''} ${user.last_name || ''}`.trim();
        const contact = user.username ? `@${user.username}` : `ID: ${user.id}`;
        userInfo = `${name} (${contact})`;
      }
      return userInfo;
    }

    function buildParams() {
      const brand = document.getElementById('brand').value;
      const model = document.getElementById('model').value;

      // default: год от 2022 (если пользователь не выбрал)
      const yearVal = document.getElementById('year').value;
      const year = yearVal || '2022';

      // power: low/high -> translate to power_min/max
      const power = document.getElementById('power').value;
      let power_min = '';
      let power_max = '';
      if (power === 'low') { power_max = '160'; }
      if (power === 'high') { power_min = '161'; }

      const params = new URLSearchParams({
        mark: brand,
        model: model,
        year: year,
        price_min: pMin.value,
        price_max: pMax.value,
        user: getUserInfoForLogs()
      });

      if (power_min) params.set('power_min', power_min);
      if (power_max) params.set('power_max', power_max);

      return params;
    }

    function resetFiltersToDefault() {
      document.getElementById('brand').value = '';
      updateModels();
      document.getElementById('model').value = '';
      document.getElementById('year').value = '2022';  // дефолт свежие авто
      document.getElementById('power').value = '';
      pMin.value = 1000000;
      pMax.value = 10000000;
      syncPriceLabels();
    }

    // ====== Data fetch ======
    async function fetchCars() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="text-center py-16 animate-pulse text-slate-300 font-black uppercase text-[10px] tracking-widest">Загружаю свежие предложения...</div>';

      try {
        const params = buildParams();
        const res = await fetch(API_URL + '?' + params.toString());
        const data = await res.json();

        lastCars = Array.isArray(data?.cars) ? data.cars : [];
        render();

        // авто-сворачиваем фильтры после поиска
        document.getElementById('filtersWrap').classList.add('hidden');
      } catch (e) {
        list.innerHTML = '<div class="text-center py-16 font-bold text-slate-400">Ошибка соединения</div>';
      }
    }

    // ====== Render ======
    function render() {
      const list = document.getElementById('list');

      if (currentTab === 'fav') {
        const favCars = getFavCars();
        if (!favCars.length) {
          list.innerHTML = `
            <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
              <div class="font-black uppercase text-slate-700 mb-2">Избранных пока нет</div>
              <div class="text-sm text-slate-500 font-bold">Нажимай ❤️ на карточках — и они появятся здесь.</div>
            </div>
          `;
          return;
        }
        list.innerHTML = favCars.map((c, idx) => renderCard(c, idx, true)).join('');
        attachGalleryHandlers();
        return;
      }

      // all
      if (!lastCars.length) {
        list.innerHTML = '<div class="text-center py-16 font-bold text-slate-400">Ничего не найдено</div>';
        return;
      }

      list.innerHTML = lastCars.map((c, idx) => renderCard(c, idx, false)).join('');
      attachGalleryHandlers();
    }

    function renderCard(c, idx, inFavTab) {
      const photos = safePhotosFromCar(c);
      const turnkey = getTurnkeyPrice(c);
      const liked = isFav(c);

      return `
      <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100">
        <div class="relative">
          <img src="${c.photo || photos[0]}" class="w-full h-64 object-cover js-main-photo" data-photos='${escapeForDataAttr(JSON.stringify(photos))}' data-index="0">

          <!-- Like -->
          <button class="js-like absolute top-4 right-4 w-12 h-12 rounded-2xl backdrop-blur bg-white/80 border border-white shadow-lg flex items-center justify-center active:scale-95 transition"
                  data-idx="${idx}"
                  aria-label="Нравится">
            <span class="text-2xl">${liked ? '❤️' : '🤍'}</span>
          </button>

          <div class="absolute bottom-3 right-3 flex gap-1.5 bg-black/20 p-1.5 rounded-2xl backdrop-blur-sm">
            ${photos.slice(0, 5).map((p, tIdx) => `<img src="${p}" class="w-10 h-10 rounded-xl border-2 border-white object-cover cursor-pointer js-thumb" data-idx="${tIdx}">`).join("")}
          </div>
        </div>

        <div class="p-6">
          <h3 class="font-black uppercase text-xl mb-4 text-slate-800">${safeText(c.name)}</h3>

          <div class="space-y-2 text-[13px] font-bold text-slate-500 uppercase mb-6">
            <div>📍 ПРОБЕГ: <span class="text-slate-900">${safeText(c.km)}</span></div>
            <div>📅 ГОД: <span class="text-slate-900">${safeText(c.year)} г.</span></div>
            <div>✅ ДВС: <span class="text-slate-900">${safeText(c.volume)}</span></div>
            <div>⚙️ МОЩНОСТЬ: <span class="text-slate-900">${safeText(c.power)}</span></div>
            <div>➕ ПРИВОД: <span class="text-slate-900">${safeText(c.drive)}</span></div>
          </div>

          <div class="pt-5 border-t border-slate-100">
            <div class="text-[10px] font-black text-slate-400 uppercase mb-1">Цена под ключ до РФ:</div>
            <div class="text-3xl font-black text-blue-600 tracking-tighter">${turnkey} ₽</div>
          </div>

          <div class="mt-5">
            <details class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
              <summary class="cursor-pointer font-black text-[10px] uppercase tracking-widest text-slate-700">Опции / комплектация</summary>
              <div class="mt-4">${renderOptions(c)}</div>
            </details>
          </div>

          <div class="grid grid-cols-2 gap-3 mt-5">
            <a href="${safeText(c.url, '#')}" target="_blank"
               class="block w-full bg-slate-900 text-white text-center py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest">
              Оригинал
            </a>
            <button class="js-like w-full bg-blue-600 text-white text-center py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition"
                    data-idx="${idx}">
              ${liked ? 'Убрать ❤️' : 'В избранное'}
            </button>
          </div>

          ${inFavTab ? `
            <div class="mt-4 text-[10px] font-black uppercase tracking-widest text-slate-400">
              Это авто в избранном
            </div>
          ` : ''}
        </div>
      </div>
      `;
    }

    // ====== Tabs + Filters UI ======
    function setTab(tab) {
      currentTab = tab;

      const tabAll = document.getElementById('tabAll');
      const tabFav = document.getElementById('tabFav');

      if (tab === 'all') {
        tabAll.className = 'py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-900 text-white';
        tabFav.className = 'py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-100 text-slate-700';
      } else {
        tabFav.className = 'py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-900 text-white';
        tabAll.className = 'py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-slate-100 text-slate-700';
      }
      render();
    }

    document.getElementById('tabAll').onclick = () => setTab('all');
    document.getElementById('tabFav').onclick = () => setTab('fav');

    document.getElementById('toggleFilters').onclick = () => {
      const wrap = document.getElementById('filtersWrap');
      wrap.classList.toggle('hidden');
    };

    document.getElementById('btnApply').onclick = async () => {
      setTab('all');
      await fetchCars();
    };

    document.getElementById('btnReset').onclick = async () => {
      resetFiltersToDefault();
      setTab('all');
      await fetchCars();
    };

    // ====== Init defaults ======
    updateModels();
    fillYears(1990);
    syncPriceLabels();

    // default year = 2022
    document.getElementById('year').value = '2022';

    // автозагрузка на старте (свежие авто)
    fetchCars();
  </script>
</body>
</html>
