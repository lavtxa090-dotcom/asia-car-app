<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>China Auto Export</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">
  <div class="max-w-md mx-auto p-4">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black text-blue-600 italic uppercase">AutoTrust</h1>
        <div class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-1 rounded">2026 UPDATE</div>
    </header>

    <div class="bg-white rounded-[32px] p-5 shadow-sm border border-slate-200 mb-6">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <select id="brandSelect" class="w-full bg-slate-100 border-none rounded-2xl p-3 text-sm font-bold outline-none" onchange="fillModels()"></select>
        <select id="modelSelect" class="w-full bg-slate-100 border-none rounded-2xl p-3 text-sm font-bold outline-none"></select>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-4">
        <select id="yearSelect" class="w-full bg-slate-100 border-none rounded-2xl p-3 text-sm font-bold outline-none"></select>
        <select id="powerSelect" class="w-full bg-slate-100 border-none rounded-2xl p-3 text-sm font-bold outline-none">
            <option value="any">Мощность</option>
            <option value="low">До 160 л.с.</option>
            <option value="high">160+ л.с.</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Макс. бюджет под ключ (₽)</label>
        <input type="range" id="priceRange" min="1500000" max="15000000" step="500000" value="5000000" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
        <div id="priceVal" class="text-right text-blue-600 font-black text-sm mt-1">до 5.0 млн</div>
      </div>

      <button id="searchBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-100 active:scale-95 transition-all uppercase tracking-widest text-xs">
        Найти варианты
      </button>
    </div>

    <div id="results" class="space-y-4 pb-10"></div>
  </div>

  <script>
    const API_URL = "https://plifartorikern.beget.app/webhook/get-cars";
    const SUGGEST = {
      "Geely": ["Monjaro","Tugella","Coolray","Preface"],
      "Zeekr": ["001","007","009","X"],
      "Li Auto": ["L6","L7","L8","L9"],
      "Toyota": ["Camry","RAV4","Highlander"],
      "Volkswagen": ["Tiguan L","Teramont","T-Roc","ID.4"]
    };

    const priceRange = document.getElementById("priceRange");
    const priceVal = document.getElementById("priceVal");
    priceRange.oninput = () => priceVal.innerText = `до ${(priceRange.value / 1000000).toFixed(1)} млн`;

    function fillBrands() {
      const brandSelect = document.getElementById("brandSelect");
      brandSelect.innerHTML = Object.keys(SUGGEST).map(b => `<option value="${b}">${b}</option>`).join("");
      fillModels();
    }

    function fillModels() {
      const brand = document.getElementById("brandSelect").value;
      const modelSelect = document.getElementById("modelSelect");
      modelSelect.innerHTML = SUGGEST[brand].map(m => `<option value="${m}">${m}</option>`).join("");
    }

    function fillYears() {
      const yearSelect = document.getElementById("yearSelect");
      let html = '<option value="">Год от</option>';
      for (let y = 2025; y >= 2018; y--) html += `<option value="${y}">${y}</option>`;
      yearSelect.innerHTML = html;
    }

    async function loadCars() {
      const resultsEl = document.getElementById("results");
      resultsEl.innerHTML = '<div class="text-center py-10 animate-pulse text-slate-400 font-bold">Связь с Китаем...</div>';

      const query = new URLSearchParams({
        mark: document.getElementById("brandSelect").value,
        model: document.getElementById("modelSelect").value,
        year: document.getElementById("yearSelect").value,
        power: document.getElementById("powerSelect").value,
        price: priceRange.value
      });

      try {
        const res = await fetch(`${API_URL}?${query.toString()}`);
        const data = await res.json();
        
        resultsEl.innerHTML = (data.cars || []).map(c => `
          <div class="bg-white rounded-[32px] overflow-hidden border border-slate-100 shadow-sm">
            <img src="${c.photo}" class="w-full h-52 object-cover" onerror="this.src='https://placehold.co/600x400?text=Auto'">
            <div class="p-5">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-black text-lg uppercase leading-tight">${c.name}</h3>
                <span class="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded">${c.year}</span>
              </div>
              <div class="text-2xl font-black text-blue-600 mb-3">${c.priceRub} ₽</div>
              <div class="flex gap-3 text-[10px] font-bold text-slate-400 uppercase">
                <span>${c.km}</span>
                <span>${c.power} л.с.</span>
              </div>
              <a href="${c.url}" target="_blank" class="block w-full text-center bg-slate-900 text-white py-3 rounded-xl mt-4 font-black text-[10px] uppercase tracking-widest">Открыть оригинал</a>
            </div>
          </div>
        `).join("") || '<div class="text-center py-10 text-slate-400">Нет машин под этот бюджет</div>';
      } catch (e) {
        resultsEl.innerHTML = '<div class="text-center text-red-500 font-bold">Ошибка сети</div>';
      }
    }

    fillBrands();
    fillYears();
    document.getElementById("searchBtn").onclick = loadCars;
    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
  </script>
</body>
</html>
