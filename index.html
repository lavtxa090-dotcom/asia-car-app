<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>AsiaCar Premium 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div class="max-w-md mx-auto p-4">
    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black text-blue-600 italic uppercase tracking-tighter">AsiaCar</h1>
        <div class="text-[10px] font-bold bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm text-slate-400">PRO SYSTEM</div>
    </header>

    <div class="bg-white rounded-[2.5rem] p-6 shadow-xl border border-slate-100 mb-8">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <select id="brand" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none" onchange="updateModels()">
          <option value="">Все марки</option>

          <!-- China -->
          <option value="BYD">BYD</option>
          <option value="CHERY">Chery</option>
          <option value="CHANGAN">Changan</option>
          <option value="EXEED">Exeed</option>
          <option value="GAC">GAC</option>
          <option value="GEELY">Geely</option>
          <option value="HAVAL">Haval</option>
          <option value="HONGQI">Hongqi</option>
          <option value="JAECOO">Jaecoo</option>
          <option value="JETOUR">Jetour</option>
          <option value="LEAPMOTOR">Leapmotor</option>
          <option value="LI AUTO">Li Auto</option>
          <option value="LYNK & CO">Lynk &amp; Co</option>
          <option value="NIO">Nio</option>
          <option value="OMODA">Omoda</option>
          <option value="TANK">Tank</option>
          <option value="WEY">Wey</option>
          <option value="XPENG">Xpeng</option>
          <option value="XIAOMI">Xiaomi</option>
          <option value="ZEEKR">Zeekr</option>

          <!-- Germany / Japan / US -->
          <option value="AUDI">Audi</option>
          <option value="BMW">BMW</option>
          <option value="MERCEDES-BENZ">Mercedes-Benz</option>
          <option value="VOLKSWAGEN">Volkswagen</option>
          <option value="HONDA">Honda</option>
          <option value="NISSAN">Nissan</option>
          <option value="TOYOTA">Toyota</option>
          <option value="LEXUS">Lexus</option>
          <option value="TESLA">Tesla</option>
          <option value="BUICK">Buick</option>
          <option value="CADILLAC">Cadillac</option>

          <option value="SUBARU">Subaru</option>
        </select>

        <select id="model" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none">
          <option value="">Любая модель</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <select id="year" class="w-full bg-slate-50 rounded-2xl p-4 text-sm font-bold outline-none appearance-none">
          <option value="">Год от</option>
        </select>

        <select id="power" class="w-full bg-slate-100 rounded-2xl p-4 text-sm font-bold border-blue-200 border outline-none appearance-none">
          <option value="any">Мощность</option>
          <option value="low">До 160 л.с.</option>
          <option value="high">160+ л.с.</option>
        </select>
      </div>

      <div class="space-y-4 mb-8">
        <div class="flex justify-between text-[11px] font-black uppercase text-slate-400">
            <span>От: <span id="minVal" class="text-blue-600 tracking-tighter">1.0 млн</span></span>
            <span>До: <span id="maxVal" class="text-blue-600 tracking-tighter">10.0 млн</span></span>
        </div>
        <input type="range" id="priceMin" min="1000000" max="15000000" step="500000" value="1000000" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
        <input type="range" id="priceMax" min="1000000" max="15000000" step="500000" value="10000000" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
      </div>

      <button onclick="search()" class="w-full bg-blue-600 text-white font-black py-5 rounded-[1.5rem] shadow-lg active:scale-95 transition-all uppercase text-[10px] tracking-[0.2em]">
        Найти предложения
      </button>
    </div>

    <div id="list" class="space-y-10 pb-20"></div>
  </div>

  <script>
    // Справочник фильтров
    const modelsData = {
      "GEELY": ["Monjaro", "Tugella", "Coolray", "Preface", "Okavango", "Emgrand", "Boyue L", "Xingyue L", "Galaxy L7", "Galaxy E8"],
      "BYD": ["Han", "Tang", "Seal", "Dolphin", "Seagull", "Qin Plus", "Qin L", "Song Plus", "Song Pro", "Destroyer 05", "Frigate 07", "Yuan Plus"],
      "ZEEKR": ["001", "007", "009", "X"],
      "LI AUTO": ["L6", "L7", "L8", "L9", "MEGA"],
      "CHERY": ["Arrizo 8", "Tiggo 7 Pro", "Tiggo 8 Pro Max", "Tiggo 9"],
      "EXEED": ["RX", "TXL", "VX"],
      "OMODA": ["Omoda C5"],
      "JAECOO": ["Jaecoo J7"],
      "JETOUR": ["X70", "X90"],
      "TANK": ["300", "400 Hi4-T", "500 Hi4-T", "700 Hi4-T"],
      "HAVAL": ["H6", "Dargo", "Jolion"],
      "WEY": ["Coffee 01", "Coffee 02"],
      "CHANGAN": ["CS35 Plus", "CS55 Plus", "CS75 Plus", "UNI-K", "UNI-T", "UNI-V"],
      "GAC": ["GS8", "Aion Y"],
      "HONGQI": ["H5", "H9"],
      "LEAPMOTOR": ["C10", "C11"],
      "NIO": ["ES6", "ET5"],
      "XPENG": ["G6", "P7"],
      "XIAOMI": ["SU7", "MX11"],
      "LYNK & CO": ["01", "03"],
      "TOYOTA": ["Camry", "RAV4", "Highlander", "Frontlander", "Crown Kluger", "Sienna", "Alphard", "Corolla", "Corolla Cross", "Avalon", "Prado"],
      "NISSAN": ["Sylphy", "Altima", "Ariya", "Qashqai", "X-Trail"],
      "HONDA": ["Civic", "Accord", "CR-V", "HR-V", "ZR-V", "Odyssey", "Elysion"],
      "LEXUS": ["ES", "NX", "RX", "GX", "LX", "LM", "IS", "LS", "RZ"],
      "VOLKSWAGEN": ["Passat Pro", "Magotan", "Sagitar", "Tayron L", "Tayron X", "Teramont", "Teramont X", "Tavendor", "Talagon", "ID.3", "ID.4 X", "ID.6 X", "Touareg", "CC"],
      "AUDI": ["A3 Sportback", "A3 Limousine", "A4L", "A6L", "A7L", "A8L", "Q2L", "Q3", "Q3 Sportback", "Q5L", "Q5L Sportback", "Q7", "Q8"],
      "BMW": ["i3", "i4", "i7", "iX1", "iX3", "3 Series L", "5 Series L", "X1 L", "X3 L", "X5 L", "7 Series", "M3", "M4", "M5"],
      "MERCEDES-BENZ": ["A-Class L", "C-Class L", "E-Class L", "S-Class", "GLA", "GLB", "GLC L", "GLE", "GLS", "G-Class", "EQB", "EQC", "EQE", "EQS"],
      "TESLA": ["Model 3", "Model Y", "Model YL", "Cybertruck"],
      "BUICK": ["GL8", "Regal", "Envision", "Encore", "LaCrosse"],
      "CADILLAC": ["CT4", "CT5", "CT6", "Lyriq"],
      "SUBARU": ["Forester", "Outback", "XV"]
    };

    function updateModels() {
      const b = document.getElementById('brand').value;
      const m = document.getElementById('model');
      m.innerHTML = '<option value="">Любая модель</option>';
      if (modelsData[b]) {
        modelsData[b].forEach(item => m.innerHTML += `<option value="${item.toUpperCase()}">${item}</option>`);
      }
    }

    function fillYears(minYear = 1990) {
      const yearSelect = document.getElementById('year');
      const currentYear = new Date().getFullYear();

      yearSelect.innerHTML = '<option value="">Год от</option>';
      for (let y = currentYear; y >= minYear; y--) {
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    const pMin = document.getElementById("priceMin");
    const pMax = document.getElementById("priceMax");

    pMin.oninput = () => document.getElementById("minVal").innerText = (pMin.value/1000000).toFixed(1) + ' млн';
    pMax.oninput = () => document.getElementById("maxVal").innerText = (pMax.value/1000000).toFixed(1) + ' млн';

    function safeText(v, fallback = '') {
      if (v === null || v === undefined) return fallback;
      return String(v);
    }

    function safePhotosFromCar(c) {
      const arr = Array.isArray(c.photos) ? c.photos.filter(Boolean) : [];
      if (arr.length) return arr;
      if (c.photo) return [c.photo];
      return [];
    }

    function escapeForDataAttr(jsonString) {
      return jsonString.replace(/</g, '\\u003c').replace(/&/g, '\\u0026');
    }

    function getTurnkeyPrice(c) {
      if (c && c.priceRub !== undefined && c.priceRub !== null && c.priceRub !== '') return c.priceRub;
      if (c && c.priceTotalRub !== undefined && c.priceTotalRub !== null && c.priceTotalRub !== '') return c.priceTotalRub;

      const n = c?.priceBreakdown?.total ?? c?.priceBreakdown?.Total ?? null;
      if (typeof n === 'number' && Number.isFinite(n)) return n.toLocaleString('ru-RU');

      return '';
    }

    function normalizePowerLabel(c) {
      const v = c?.power ?? c?.horsePower ?? c?.horse_power ?? c?.hp ?? null;
      if (v === null || v === undefined || v === '') return '';
      const s = String(v).trim();
      if (/[а-я]/i.test(s) || s.includes('л.с') || s.includes('лс')) return s;
      return s;
    }

    function attachGalleryHandlers() {
      document.querySelectorAll('.js-thumb').forEach(th => {
        th.onclick = (e) => {
          const idx = Number(e.currentTarget.dataset.idx || 0);
          const card = e.currentTarget.closest('.relative');
          const main = card?.querySelector('.js-main-photo');
          if (!main) return;

          let photos = [];
          try { photos = JSON.parse(main.dataset.photos || '[]'); } catch (err) {}
          if (!photos[idx]) return;

          main.src = photos[idx];
          main.dataset.index = String(idx);
        };
      });

      document.querySelectorAll('.js-main-photo').forEach(img => {
        let x0 = null;

        const lock = (e) => {
          x0 = (e.touches ? e.touches[0].clientX : e.clientX);
        };

        const move = (e) => {
          if (x0 === null) return;
          const x1 = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
          const dx = x1 - x0;
          x0 = null;

          if (Math.abs(dx) < 30) return;

          let photos = [];
          try { photos = JSON.parse(img.dataset.photos || '[]'); } catch (err) {}
          if (!photos.length) return;

          let idx = Number(img.dataset.index || 0);
          idx = dx < 0 ? idx + 1 : idx - 1;
          if (idx < 0) idx = photos.length - 1;
          if (idx >= photos.length) idx = 0;

          img.src = photos[idx];
          img.dataset.index = String(idx);
        };

        img.addEventListener('touchstart', lock, { passive: true });
        img.addEventListener('touchend', move, { passive: true });
        img.addEventListener('mousedown', lock);
        img.addEventListener('mouseup', move);
      });
    }

    function renderOptions(c) {
      const opt = c?.options ?? c?.specs ?? null;
      if (!opt) return `<div class="text-[12px] text-slate-400 font-bold">Нет данных по комплектации</div>`;

      if (Array.isArray(opt)) {
        const items = opt
          .filter(x => x && (x.label || x.key) && (x.value !== undefined))
          .slice(0, 14);

        if (!items.length) return `<div class="text-[12px] text-slate-400 font-bold">Нет данных по комплектации</div>`;

        return `
          <div class="grid grid-cols-1 gap-2">
            ${items.map(it => `
              <div class="flex justify-between gap-3 text-[12px] font-bold uppercase">
                <span class="text-slate-400">${safeText(it.label || it.key)}</span>
                <span class="text-slate-900 text-right">${safeText(it.value)}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (typeof opt === 'object') {
        const entries = Object.entries(opt)
          .filter(([k, v]) => v !== null && v !== undefined && v !== '' && v !== 'empty' && v !== 'пусто' && v !== 'пустой')
          .slice(0, 14);

        if (!entries.length) return `<div class="text-[12px] text-slate-400 font-bold">Нет данных по комплектации</div>`;

        return `
          <div class="grid grid-cols-1 gap-2">
            ${entries.map(([k, v]) => `
              <div class="flex justify-between gap-3 text-[12px] font-bold uppercase">
                <span class="text-slate-400">${safeText(k).replace(/_/g,' ')}</span>
                <span class="text-slate-900 text-right">${safeText(v)}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `<div class="text-[12px] text-slate-400 font-bold">Нет данных по комплектации</div>`;
    }

    // отправка выбранного авто в n8n (save-car)
    async function saveToBot(car) {
      const tg = window.Telegram?.WebApp;
      const user = tg?.initDataUnsafe?.user || {};

      const payload = { car, user };

      try {
        const res = await fetch('https://plifartorikern.beget.app/webhook/save-car', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (data.ok) {
          if (tg?.showPopup) {
            tg.showPopup({ title: 'Сохранено', message: 'Авто добавлено в вашу базу AsiaCar.' });
          } else {
            alert('Авто сохранено');
          }
        } else {
          if (tg?.showAlert) tg.showAlert('Ошибка при сохранении авто');
          else alert('Ошибка при сохранении авто');
        }
      } catch (e) {
        if (tg?.showAlert) tg.showAlert('Ошибка соединения при сохранении авто');
        else alert('Ошибка соединения при сохранении авто');
      }
    }

    async function search() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="text-center py-20 animate-pulse text-slate-300 font-black uppercase text-[10px] tracking-widest">Анализ рынка КНР...</div>';

      const tg = window.Telegram?.WebApp;
      const user = tg?.initDataUnsafe?.user || {};

      const payload = {
        mark: document.getElementById('brand').value,
        model: document.getElementById('model').value,
        year: document.getElementById('year').value,
        power: document.getElementById('power').value,
        price_min: pMin.value,
        price_max: pMax.value,
        user
      };

      try {
        const res = await fetch('https://plifartorikern.beget.app/webhook/get-cars', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        list.innerHTML = (data.cars || []).map(c => {
          const photos = safePhotosFromCar(c);
          const photosJson = escapeForDataAttr(JSON.stringify(photos));

          const turnkey = getTurnkeyPrice(c);
          const powerLabel = normalizePowerLabel(c);

          return `
          <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100">
            <div class="relative">
              <img
                src="${safeText(c.photo, photos[0] || '')}"
                class="w-full h-64 object-cover js-main-photo"
                data-photos='${photosJson}'
                data-index="0"
                alt=""
              >

              <div class="absolute bottom-3 right-3 flex gap-1.5 bg-black/20 p-1.5 rounded-2xl backdrop-blur-sm">
                ${photos.slice(0, 6).map((p, idx) => `
                  <img
                    src="${p}"
                    class="w-12 h-12 rounded-xl border-2 border-white object-cover shadow-lg cursor-pointer js-thumb"
                    data-idx="${idx}"
                    alt=""
                  >
                `).join("")}
              </div>
            </div>

            <div class="p-6">
              <h3 class="font-black uppercase text-xl mb-4 leading-tight tracking-tighter text-slate-800">${safeText(c.name)}</h3>
              <div class="space-y-2 text-[13px] font-bold text-slate-500 uppercase tracking-tight mb-6">
                <div>📍 ПРОБЕГ: <span class="text-slate-900">${safeText(c.km)}</span></div>
                <div>📅 ГОД: <span class="text-slate-900">${safeText(c.year)} г.</span></div>
                <div>✅ ДВС: <span class="text-slate-900">${safeText(c.volume)}</span></div>
                <div>⚙️ МОЩНОСТЬ: <span class="text-slate-900">${safeText(powerLabel)}</span></div>
                <div>➕ ПРИВОД: <span class="text-slate-900">${safeText(c.drive)}</span></div>
              </div>

              <div class="pt-5 border-t border-slate-100">
                <div class="text-[10px] font-black text-slate-400 uppercase mb-1">Цена под ключ до РФ:</div>
                <div class="text-3xl font-black text-blue-600 tracking-tighter">${safeText(turnkey)} ₽</div>
              </div>

              <div class="mt-5">
                <details class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                  <summary class="cursor-pointer select-none font-black text-[10px] uppercase tracking-[0.2em] text-slate-700">
                    Опции / комплектация
                  </summary>
                  <div class="mt-4">
                    ${renderOptions(c)}
                  </div>
                </details>
              </div>

              <button
                class="block w-full bg-blue-500 text-white text-center py-3 rounded-2xl font-black text-[10px] uppercase mt-3 tracking-[0.2em]"
                onclick="saveToBot(${JSON.stringify({
                  name: c.name,
                  year: c.year,
                  km: c.km,
                  volume: c.volume,
                  power: powerLabel,
                  drive: c.drive,
                  price: getTurnkeyPrice(c),
                  url: c.url,
                  photo: photos[0] || c.photo || null,
                  brand: (c.name || '').split(' ')[0] || '',
                  model: (c.name || '').split(' ').slice(1).join(' ') || ''
                }).replace(/"/g, '&quot;')})"
              >
                Сохранить авто
              </button>

              <a href="${safeText(c.url, '#')}" target="_blank"
                class="block w-full bg-slate-900 text-white text-center py-4 rounded-2xl font-black text-[10px] uppercase mt-5 tracking-[0.2em]">
                Посмотреть оригинал
              </a>
            </div>
          </div>
          `;
        }).join("") || '<div class="text-center py-20 font-bold text-slate-400">Ничего не найдено</div>';

        attachGalleryHandlers();
      } catch (e) {
        list.innerHTML = 'Ошибка соединения';
      }
    }

    updateModels();
    fillYears(1990);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
