<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>AsiaCar Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div class="max-w-md mx-auto p-4">
    <div class="bg-white rounded-[2rem] p-5 shadow-xl border border-slate-100 mb-6">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <select id="brand" class="w-full bg-slate-100 rounded-xl p-3 text-sm font-bold outline-none" onchange="updateModels()">
          <option value="GEELY">Geely</option><option value="BYD">BYD</option><option value="TOYOTA">Toyota</option><option value="SUBARU">Subaru</option>
        </select>
        <select id="model" class="w-full bg-slate-100 rounded-xl p-3 text-sm font-bold outline-none">
          <option value="">Любая модель</option>
        </select>
      </div>
      <button onclick="search()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all uppercase text-[10px] tracking-widest">
        Найти варианты
      </button>
    </div>

    <div id="list" class="space-y-8 pb-20"></div>
  </div>

  <script>
    const modelsData = { "GEELY": ["Monjaro", "Tugella"], "TOYOTA": ["Camry", "RAV4"], "SUBARU": ["Forester", "Outback"] };
    function updateModels() {
      const b = document.getElementById('brand').value; const m = document.getElementById('model');
      m.innerHTML = '<option value="">Любая модель</option>';
      if(modelsData[b]) modelsData[b].forEach(item => m.innerHTML += `<option value="${item.toUpperCase()}">${item}</option>`);
    }

    async function search() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="text-center py-20 animate-pulse text-slate-300 font-black uppercase text-[10px] tracking-widest">Загрузка данных...</div>';
      const params = new URLSearchParams({ mark: document.getElementById('brand').value, model: document.getElementById('model').value });

      try {
        const res = await fetch(`https://plifartorikern.beget.app/webhook/get-cars?${params}`);
        const data = await res.json();
        
        list.innerHTML = (data || []).map(c => `
          <div class="bg-white rounded-[2rem] overflow-hidden shadow-lg border border-slate-100">
            <div class="relative">
                <img src="${c.photo}" class="w-full h-56 object-cover">
                <div class="absolute bottom-2 right-2 flex gap-1 p-2">
                    ${(c.photos || []).slice(1, 5).map(p => `<img src="${p}" class="w-12 h-12 rounded-lg border-2 border-white object-cover shadow-md">`).join("")}
                </div>
            </div>
            
            <div class="p-6">
              <h3 class="text-xl font-bold text-slate-800 mb-4">${c.name}</h3>
              
              <div class="space-y-3 mb-6 text-sm font-medium text-slate-600">
                <div class="flex items-center gap-2">📍 Пробег: ${c.km}</div>
                <div class="flex items-center gap-2">📅 Год: ${c.year} г.</div>
                <div class="flex items-center gap-2">✅ ДВС: ${c.volume}</div>
                <div class="flex items-center gap-2">⚙️ Мощность: ${c.power} л.с.</div>
                <div class="flex items-center gap-2">➕ Привод: ${c.drive}</div>
              </div>

              <div class="pt-4 border-t border-slate-100">
                <div class="text-[10px] font-bold text-slate-400 uppercase mb-1">Цена под ключ до РФ:</div>
                <div class="text-3xl font-black text-blue-600 tracking-tighter">${c.priceRub} ₽</div>
              </div>
              
              <a href="${c.url}" target="_blank" class="block w-full bg-slate-900 text-white text-center py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest mt-4">Оригинал объявления</a>
            </div>
          </div>
        `).join("") || '<div class="text-center py-20 font-bold text-slate-400">Ничего не найдено</div>';
      } catch (e) { list.innerHTML = 'Ошибка соединения'; }
    }
    updateModels();
  </script>
</body>
</html>
